<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e1a;
      }

      input::placeholder {
        color: #94a3b8;
      }

      #gameContainer {
        position: relative;
        /* size is set by resizeGame() in frontend.js */
        width: 1024px;
        height: 576px;
      }

      #arenaBackground {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 50%, #0d1224 100%);
        z-index: 0;
      }

      #arenaBackground::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          linear-gradient(rgba(30, 64, 175, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(30, 64, 175, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        position: relative;
        z-index: 1;
        touch-action: none;
      }

      /* Mobile controls */
      #mobileControls {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 25;
        pointer-events: none;
      }

      /* Only show on real touch/coarse-pointer devices */
      @media (pointer: coarse) {
        #mobileControls {
          display: block;
        }
      }

      /* Hide while the username form is showing. */
      #mobileControls.hidden {
        display: none !important;
      }

      #joystickContainer {
        position: absolute;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: calc(20px + env(safe-area-inset-left));
        width: 120px;
        height: 120px;
        pointer-events: auto;
        touch-action: none;
      }

      #joystickBase {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(59, 130, 246, 0.2);
        border: 2px solid rgba(59, 130, 246, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #joystickThumb {
        position: absolute;
        width: 50px;
        height: 50px;
        background: rgba(59, 130, 246, 0.6);
        border: 2px solid rgba(96, 165, 250, 0.8);
        border-radius: 50%;
        transform: translate(0, 0);
      }

      /* Landscape on small screens — shrink joystick so it doesn't eat too much space */
      @media (max-height: 500px) and (orientation: landscape) {
        #joystickContainer {
          width: 90px;
          height: 90px;
          bottom: calc(10px + env(safe-area-inset-bottom));
          left: calc(10px + env(safe-area-inset-left));
        }
        #joystickThumb {
          width: 38px;
          height: 38px;
        }
      }

      #fireButton {
        position: absolute;
        bottom: calc(20px + env(safe-area-inset-bottom));
        right: calc(20px + env(safe-area-inset-right));
        width: 100px;
        height: 100px;
        pointer-events: auto;
        touch-action: none;
        cursor: crosshair;
      }

      #fireButtonCanvas {
        display: block;
        background: rgba(239, 68, 68, 0.5);
        border: 2px solid rgba(239, 68, 68, 0.7);
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      }

      #fireButton.active #fireButtonCanvas {
        background: rgba(239, 68, 68, 0.8);
        border-color: rgba(248, 113, 113, 1);
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      }

      @media (max-height: 500px) and (orientation: landscape) {
        #fireButton {
          width: 80px;
          height: 80px;
          bottom: calc(10px + env(safe-area-inset-bottom));
          right: calc(10px + env(safe-area-inset-right));
        }
      }

    </style>
  </head>
  <body>
    <div id="gameContainer">
      <div id="arenaBackground"></div>
      <div
        id="leaderboard"
        style="
          position: absolute;
          top: 0;
          left: 0;
          color: white;
          padding: 12px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          font-size: 14px;
          user-select: none;
          background: rgba(10, 14, 26, 0.3);
          border: 1px solid rgba(59, 130, 246, 0.2);
          border-radius: 0 0 8px 0;
          z-index: 10;
          min-width: 200px;
          pointer-events: none;
        "
      >
        <div style="margin-bottom: 8px; font-weight: bold; color: #60a5fa; font-size: 16px;">TOP KILLS</div>
        <div id="topKillsLeaderboard" style="margin-bottom: 12px;"></div>
        <div style="margin-bottom: 8px; font-weight: bold; color: #94a3b8; font-size: 14px;">CURRENT MATCH</div>
        <div id="playerLabels"></div>
      </div>
      <canvas></canvas>

      <!-- FPS / Ping HUD -->
      <div id="statsHud" style="
        position: absolute;
        top: 0;
        right: 0;
        color: white;
        padding: 6px 10px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        user-select: none;
        background: rgba(10, 14, 26, 0.75);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 0 0 0 8px;
        z-index: 10;
        pointer-events: none;
        text-align: right;
        line-height: 1.6;
      ">
        <div id="fpsDisplay" style="color: #4ade80;">FPS: --</div>
        <div id="pingDisplay" style="color: #60a5fa;">PING: -- ms</div>
      </div>

      <!-- username input -->
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 30;
        "
      >
        <form id="usernameForm">
          <div>
            <input
              id="usernameInput"
              type="text"
              placeholder="Username"
              style="
                padding: 12px;
                border-radius: 20px;
                border: none;
                background: #475569;
                color: #cbd5e1;
              "
            />
          </div>
          <div style="text-align: center; margin-top: 8px">
            <button
              style="
                padding: 8px 20px;
                border-radius: 100px;
                border: none;
                background-image: linear-gradient(
                  to right,
                  rgb(6, 182, 212),
                  rgb(59, 130, 246)
                );
                color: white;
                cursor: pointer;
              "
            >
              Start!
            </button>
          </div>
        </form>
      </div>
      <!-- username input end -->

      <!-- Mobile controls — hidden until game starts, shown by frontend.js -->
    </div><!-- end gameContainer -->

    <div id="mobileControls" class="hidden">
      <div id="joystickContainer">
        <div id="joystickBase">
          <div id="joystickThumb"></div>
        </div>
      </div>

      <!-- Fire button with drag-to-aim -->
      <div id="fireButton">
        <canvas id="fireButtonCanvas" width="100" height="100" style="display: block; width: 100%; height: 100%;"></canvas>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"
      integrity="sha512-kVlGhj2qFy+KBCFuvjBJTGUMxbdqJKs4yK2jh0e0VPhWUPiPC87bzm4THmaaIee3Oj7j6sDpTTgm2EPPiESqBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="./js/classes/Enemy.js"></script>
    <script src="./js/classes/Player.js"></script>
    <script src="./js/classes/Particle.js"></script>
    <script src="./js/classes/Projectile.js"></script>
    <script src="./js/frontend.js"></script>
    <script src="./js/eventListeners.js"></script>
  </body>
</html>
